workflows:
  ios-build:
    name: Godot iOS Signed Build
    max_build_duration: 120
    environment:
      xcode: 16.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kickupkings.kickupkings
      vars:
        BUNDLE_ID: "com.kickupkings.kickupkings"
        TEAM_ID: "9WY9B7WP2D"

    scripts:
      - name: Find Xcode project and set env vars
        script: |
          cd ios
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "XCODEPROJ=$XCODEPROJ" >> $CM_ENV
          echo "SCHEME=$SCHEME" >> $CM_ENV
          echo "Found project: $XCODEPROJ, scheme: $SCHEME"

      - name: DEBUG - Check all signing vars
        script: |
          echo "====== SIGNING DEBUG ======"
          echo "CM_PROVISIONING_PROFILE=[$CM_PROVISIONING_PROFILE]"
          echo "CM_PROVISIONING_PROFILE_UUID=[$CM_PROVISIONING_PROFILE_UUID]"
          echo "CM_CERTIFICATE=[$CM_CERTIFICATE]"
          echo "XCODEPROJ=[$XCODEPROJ]"
          echo "SCHEME=[$SCHEME]"
          echo ""
          echo "--- Keychain identities ---"
          security find-identity -v -p codesigning
          echo ""
          echo "--- Installed provisioning profiles ---"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles folder found"
          echo ""
          echo "--- Current signing settings in pbxproj ---"
          grep -E "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER" \
            ios/pruduction_build.xcodeproj/project.pbxproj || echo "Could not read pbxproj"
          echo "====== END DEBUG ======"

      - name: Fix signing in pbxproj
        script: |
          cd ios
          PBXPROJ="pruduction_build.xcodeproj/project.pbxproj"
          echo "Patching: $PBXPROJ"

          # Use Python instead of sed to avoid GNU/BSD sed differences
          python3 << PYEOF
import re

with open("$PBXPROJ", "r") as f:
    content = f.read()

# Force manual signing
content = re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', content)

# Set team ID
content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = $TEAM_ID;', content)

# Set bundle ID
content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;', 'PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;', content)

# Set provisioning profile specifier
profile = "$CM_PROVISIONING_PROFILE"
if profile:
    if re.search(r'PROVISIONING_PROFILE_SPECIFIER', content):
        content = re.sub(
            r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;',
            f'PROVISIONING_PROFILE_SPECIFIER = "{profile}";',
            content
        )
    else:
        content = re.sub(
            r'CODE_SIGN_STYLE = Manual;',
            f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";',
            content
        )

with open("$PBXPROJ", "w") as f:
    f.write(content)

print("Patch complete")
PYEOF

          echo "=== Verifying patch ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ"

      - name: Clean and Archive iOS app
        script: |
          cd ios
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$CM_PROVISIONING_PROFILE" \
            PROVISIONING_PROFILE="$CM_PROVISIONING_PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            clean archive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive"

      - name: Create ExportOptions.plist
        script: |
          cat > $CM_BUILD_DIR/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$CM_PROVISIONING_PROFILE</string>
              </dict>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "--- ExportOptions.plist ---"
          cat $CM_BUILD_DIR/ExportOptions.plist

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/ipa"

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/App.xcarchive