workflows:
  ios-build:
    name: Godot iOS Production Build
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Show files
        script: ls -R ios

      - name: Build iOS project (SIGNED)
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "No xcodeproj found"
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          xcodebuild clean \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/app.xcarchive" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/app.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - output/*.ipa