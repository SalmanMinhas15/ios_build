workflows:
  ios-build:
    name: Godot iOS Build
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Show files
        script: ls -R ios

      - name: Build iOS project
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "No xcodeproj found"
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app"
      - "**/output/*.app"
      - "**/*.app"