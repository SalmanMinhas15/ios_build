workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - app_store_credentials 

    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build and Sign Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # 1. Archive the project (This succeeded!)
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            archive

          # 2. Automatically generate the missing ExportOptions.plist file
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          # 3. Export the Archive into a true production .ipa package using our new file
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - output/*.ipa