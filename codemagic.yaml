workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - app_store_credentials 
      vars:
        XCODE_BUNDLE_IDENTIFIER: "com.kickupkings.kickupkings"

    scripts:
      - name: Show files
        script: |
          echo "Current working directory:"
          pwd
          echo "Listing contents of ios folder:"
          ls -R ios

      - name: Sanitize Xcode Project Signing Settings
        script: |
          # Force the project to use Manual signing to align with Apple Distribution certificates
          python3 -c "
          import os
          pbx_path = 'ios/build.xcodeproj/project.pbxproj'
          if os.path.exists(pbx_path):
              with open(pbx_path, 'r') as f:
                  text = f.read()
              text = text.replace('CODE_SIGN_STYLE = \"Automatic\";', 'CODE_SIGN_STYLE = \"Manual\";')
              text = text.replace('ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;')
              with open(pbx_path, 'w') as f:
                  f.write(text)
              print('Successfully converted project configurations to Manual Signing Style.')
          else:
              print('Error: project.pbxproj not found!')
          "

      - name: Set up code signing
        script: |
          cd ios
          xcode-project use-profiles --archive-method app-store

      - name: Patch Export Options Plist Format
        script: |
          # Fix Codemagic/Godot array vs dictionary plist decoder mismatch
          python3 -c "
          import os, plistlib
          plist_path = '/Users/builder/export_options.plist'
          if os.path.exists(plist_path):
              with open(plist_path, 'rb') as f:
                  pl = plistlib.load(f)
              
              if 'provisioningProfiles' in pl and isinstance(pl['provisioningProfiles'], list):
                  print('Found provisioningProfiles formatting issue (Array). Converting to Dictionary...')
                  profile_value = pl['provisioningProfiles'][0] if pl['provisioningProfiles'] else ''
                  pl['provisioningProfiles'] = {
                      'com.kickupkings.kickupkings': profile_value
                  }
                  with open(plist_path, 'wb') as f:
                      plistlib.dump(pl, f)
                  print('Successfully patched export_options.plist format!')
          else:
              print('export_options.plist not generated yet or missing.')
          "

      - name: Build and Sign Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # 1. Dynamically extract the Provisioning Profile UUID downloaded by Codemagic
          PROV_PROFILE_UUID=$(grep -A1 "provisioningProfiles" /Users/builder/export_options.plist | grep "<string>" | sed -E 's/<\/?string>//g' | tr -d '[:space:]')
          
          echo "Extracted Profile UUID for build override: $PROV_PROFILE_UUID"

          # 2. Compile the archive while forcing parameters directly into xcodebuild flags
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            DEVELOPMENT_TEAM="9WY9B7WP2D" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_UUID" \
            archive

          # 3. Export the production IPA
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - ios/output/*.ipa