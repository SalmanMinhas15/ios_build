workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - app_store_credentials 
      # Instructs Codemagic to fetch the matching certificates uploaded to your dashboard
      vars:
        XCODE_BUNDLE_IDENTIFIER: "com.kickupkings.kickupkings" # <-- REPLACE WITH YOUR ACTUAL GODOT IOS BUNDLE ID

    scripts:
      - name: Show files
        script: ls -R ios

      - name: Set up code signing
        script: |
          # Automatically pulls your uploaded profiles/certificates and maps them to your project
          xcode-project use-profiles --archive-method app-store

      - name: Build and Sign Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # 1. Clean and Archive the project using the mapped credentials
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            archive

          # 2. Export using the exact ExportOptions profile Codemagic safely generated in step 2
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - output/*.ipa