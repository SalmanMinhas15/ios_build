workflows:
  ios-build:
    name: Godot iOS Signed Build
    max_build_duration: 120

    environment:
      xcode: latest
      vars:
        EXPORT_OPTIONS_PLIST: $CM_BUILD_DIR/ExportOptions.plist

    scripts:

      - name: Show project files
        script: |
          echo "Listing project structure..."
          ls -R

      - name: Setup ExportOptions.plist
        script: |
          echo "Preparing ExportOptions.plist..."
          cp ExportOptions.plist $EXPORT_OPTIONS_PLIST

      - name: Find Xcode project
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "❌ No xcodeproj found"
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          echo "Project: $XCODEPROJ"
          echo "Scheme: $SCHEME"

      - name: Clean build
        script: |
          cd ios
          xcodebuild clean

      - name: Archive iOS app (SIGNED)
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            archive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportOptionsPlist $EXPORT_OPTIONS_PLIST \
            -exportPath $CM_BUILD_DIR/build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/App.xcarchive