workflows:
  ios-build:
    name: Godot iOS Signed Build
    max_build_duration: 120
    environment:
      xcode: 16.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kickupkings.kickupkings
      vars:
        BUNDLE_ID: "com.kickupkings.kickupkings"
        TEAM_ID: "9WY9B7WP2D"

    scripts:
      - name: Find Xcode project and set env vars
        script: |
          cd ios
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Project: $XCODEPROJ"
          echo "Scheme:  $SCHEME"
          echo "XCODEPROJ=$XCODEPROJ" >> $CM_ENV
          echo "SCHEME=$SCHEME"       >> $CM_ENV

      - name: Debug signing environment
        script: |
          echo "=== Codemagic signing vars ==="
          echo "CM_PROVISIONING_PROFILE:      $CM_PROVISIONING_PROFILE"
          echo "CM_CERTIFICATE:               $CM_CERTIFICATE"
          echo "CM_PROVISIONING_PROFILE_UUID: $CM_PROVISIONING_PROFILE_UUID"
          echo "=============================="
          # List what's in the keychain to confirm cert is loaded
          security find-identity -v -p codesigning

      - name: Clean and Archive iOS app
        script: |
          cd ios
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$CM_PROVISIONING_PROFILE" \
            PROVISIONING_PROFILE="$CM_PROVISIONING_PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            clean archive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive"

      - name: Create ExportOptions.plist
        script: |
          cat > $CM_BUILD_DIR/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$CM_PROVISIONING_PROFILE</string>
              </dict>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "--- ExportOptions.plist ---"
          cat $CM_BUILD_DIR/ExportOptions.plist

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/ipa"

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/App.xcarchive