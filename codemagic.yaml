- name: Detect and build iOS project
  script: |
    cd ios

    XCODEPROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
    WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)

    if [ -n "$WORKSPACE" ]; then
      SCHEME=$(basename "$WORKSPACE" .xcworkspace)
      xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release build
    else
      SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
      xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" -configuration Release build
    fi