workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        XCODE_BUNDLE_IDENTIFIER: "com.kickupkings.kickupkings"

    scripts:
      - name: Show files
        script: |
          echo "Current working directory:"
          pwd
          echo "Listing contents of ios folder:"
          ls -R ios

      - name: Sanitize Xcode Project Signing Settings
        script: |
          python3 -c "
          import os, re
          pbx_path = 'ios/build.xcodeproj/project.pbxproj'
          if os.path.exists(pbx_path):
              with open(pbx_path, 'r') as f:
                  text = f.read()
              # Fix both quoted and unquoted variants
              text = text.replace('CODE_SIGN_STYLE = \"Automatic\";', 'CODE_SIGN_STYLE = \"Manual\";')
              text = text.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              text = text.replace('ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;')
              with open(pbx_path, 'w') as f:
                  f.write(text)
              print('Successfully converted to Manual Signing.')
          else:
              print('Error: project.pbxproj not found!')
          "

      - name: Set up code signing
        script: |
          cd ios
          xcode-project use-profiles --archive-method app-store

      - name: Build and Sign Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # Extract the provisioning profile UUID that use-profiles already
          # installed into ~/Library/MobileDevice/Provisioning Profiles/
          PROV_PROFILE_UUID=$(
            python3 -c "
          import plistlib, glob, os
          profiles = glob.glob(os.path.expanduser(
              '~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision'))
          bundle_id = 'com.kickupkings.kickupkings'
          for p in profiles:
              try:
                  with open(p, 'rb') as f:
                      raw = f.read()
                  # Extract the plist XML embedded in the mobileprovision
                  start = raw.index(b'<?xml')
                  end   = raw.index(b'</plist>') + len(b'</plist>')
                  pl = plistlib.loads(raw[start:end])
                  ids = pl.get('Entitlements', {}).get('application-identifier', '')
                  if bundle_id in ids:
                      print(pl['UUID'])
                      break
              except Exception:
                  pass
          "
          )

          echo "Resolved Provisioning Profile UUID: $PROV_PROFILE_UUID"

          if [ -z "$PROV_PROFILE_UUID" ]; then
            echo "ERROR: Could not find a provisioning profile for $XCODE_BUNDLE_IDENTIFIER"
            echo "Installed profiles:"
            ls ~/Library/MobileDevice/Provisioning\ Profiles/ || true
            exit 1
          fi

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            DEVELOPMENT_TEAM="9WY9B7WP2D" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_UUID" \
            archive

      - name: Export Production IPA
        script: |
          # Patch export_options.plist if provisioningProfiles is an array
          python3 -c "
          import os, plistlib
          plist_path = '/Users/builder/export_options.plist'
          if not os.path.exists(plist_path):
              print('export_options.plist not found — skipping patch')
          else:
              with open(plist_path, 'rb') as f:
                  pl = plistlib.load(f)
              if isinstance(pl.get('provisioningProfiles'), list):
                  print('Fixing provisioningProfiles: Array -> Dictionary')
                  vals = pl['provisioningProfiles']
                  pl['provisioningProfiles'] = {
                      'com.kickupkings.kickupkings': vals[0] if vals else ''
                  }
                  with open(plist_path, 'wb') as f:
                      plistlib.dump(pl, f)
                  print('Patched.')
          "

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa