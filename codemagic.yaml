workflows:
  ios-build:
    name: Godot iOS Build
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Show files
        script: ls -R ios

      - name: Build iOS project
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "No xcodeproj found"
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # 1. Compile the .app bundle to our specific output directory
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/output" \
            build

          # 2. Package the .app into a standard iOS .ipa container layout
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -r output/*.app Payload/
          zip -r GodotGame.ipa Payload
          rm -rf Payload

    # 3. Direct Codemagic to collect your new .ipa file
    artifacts:
      - "*.ipa"