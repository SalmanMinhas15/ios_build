workflows:
  ios-build:
    name: Godot iOS Build
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Show project files
        script: ls -R

      - name: Detect and build iOS project
        script: |
          cd ios

          if ls *.xcworkspace 1> /dev/null 2>&1; then
            PROJECT=$(ls *.xcworkspace)
            SCHEME=${PROJECT%%.xcworkspace}
            xcodebuild -workspace "$PROJECT" -scheme "$SCHEME" -configuration Release build
          else
            PROJECT=$(ls *.xcodeproj)
            SCHEME=${PROJECT%%.xcodeproj}
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release build
          fi

    artifacts:
      - build/**/*.app
      - build/**/*.ipa