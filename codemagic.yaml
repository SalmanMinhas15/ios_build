workflows:
  ios-build:
    name: Godot iOS Signed Build
    max_build_duration: 120

    environment:
      xcode: 16.3

    scripts:

      - name: Show project structure
        script: |
          ls -R

      # ---------------- ARCHIVE ----------------
      - name: Archive iOS app
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          echo "Project: $XCODEPROJ"
          echo "Scheme: $SCHEME"

          xcodebuild clean \
            -project "$XCODEPROJ"

          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9WY9B7WP2D \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive

      # ---------------- EXPORT OPTIONS ----------------
      - name: Create ExportOptions.plist
        script: |
          cat > $CM_BUILD_DIR/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      # ---------------- EXPORT IPA ----------------
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportOptionsPlist $CM_BUILD_DIR/ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/App.xcarchive