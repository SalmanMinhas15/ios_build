workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kickupkings.kickupkings
      groups:
        - app_store_credentials
      vars:
        XCODE_BUNDLE_IDENTIFIER: "com.kickupkings.kickupkings"

    scripts:
      - name: Show files
        script: |
          echo "Current working directory:"
          pwd
          echo "Listing contents of ios folder:"
          ls -R ios

      - name: Sanitize Xcode Project Signing Settings
        script: |
          python3 -c "
          import os
          pbx_path = 'ios/build.xcodeproj/project.pbxproj'
          if os.path.exists(pbx_path):
              with open(pbx_path, 'r') as f:
                  text = f.read()
              text = text.replace('CODE_SIGN_STYLE = \"Automatic\";', 'CODE_SIGN_STYLE = \"Manual\";')
              text = text.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              text = text.replace('ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;')
              with open(pbx_path, 'w') as f:
                  f.write(text)
              print('Successfully converted to Manual Signing.')
          else:
              print('Error: project.pbxproj not found!')
          "

      - name: Set up code signing
        script: |
          cd ios
          xcode-project use-profiles --archive-method app-store

      - name: Debug provisioning profiles
        script: |
          echo "Installed provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "Directory empty or missing"
          echo "export_options.plist contents:"
          cat /Users/builder/export_options.plist || echo "Not generated yet"

      - name: Build Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # Extract UUID from installed provisioning profile
          PROV_PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -n 1)
          if [ -z "$PROV_PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found installed on machine"
            exit 1
          fi

          PROV_PROFILE_UUID=$(python3 -c "
          import plistlib, sys
          with open('$PROV_PROFILE_PATH', 'rb') as f:
              raw = f.read()
          start = raw.index(b'<?xml')
          end = raw.index(b'</plist>') + len(b'</plist>')
          pl = plistlib.loads(raw[start:end])
          print(pl['UUID'])
          ")

          echo "Using Provisioning Profile UUID: $PROV_PROFILE_UUID"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            DEVELOPMENT_TEAM="9WY9B7WP2D" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_UUID" \
            archive

      - name: Export Production IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa