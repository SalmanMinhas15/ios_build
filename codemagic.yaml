workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - app_store_credentials 
      vars:
        XCODE_BUNDLE_IDENTIFIER: "com.kickupkings.kickupkings"

    scripts:
      - name: Show files
        script: |
          echo "Current working directory:"
          pwd
          echo "Listingcontents of ios folder:"
          ls -R ios

      - name: Set up code signing
        script: |
          # Step inside the exported project so the profile engine maps to your .xcodeproj setup
          cd ios
          xcode-project use-profiles --archive-method app-store

      - name: Build and Sign Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # 1. Compile the archive using the default project settings to bypass conflicts
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            archive

          # 2. Export and overwrite the signature using Codemagic's valid distribution options plist
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - ios/output/*.ipa