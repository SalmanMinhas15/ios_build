workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - app_store_credentials 
      vars:
        XCODE_BUNDLE_IDENTIFIER: "com.kickupkings.kickupkings"

    scripts:
      - name: Show files
        script: ls -R ios

      - name: Set up code signing
        script: |
          # Dynamically initializes your certificate and profile into the Mac keychain
          xcode-project use-profiles --archive-method app-store

      - name: Build and Sign Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # 1. Clean and Archive the project
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            archive

          # 2. Manually generate a flawless ExportOptions.plist with correct Dictionary nesting
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9WY9B7WP2D</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.kickupkings.kickupkings</key>
                  <string>$CM_PROVISIONING_PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          # 3. Export using our custom, strictly formatted file
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - output/*.ipa