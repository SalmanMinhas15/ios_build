workflows:
  ios-build:
    name: Godot iOS Signed Build
    max_build_duration: 120

    environment:
      xcode: 16.3
      vars:
        BUNDLE_ID: "com.kickupkings.kickupkings"
        SCHEME: "pruduction_build"

    scripts:

      - name: Find project safely
        script: |
          cd ios
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "❌ No xcodeproj found"
            exit 1
          fi

          echo "Project found: $XCODEPROJ"
          echo "$XCODEPROJ" > project.txt

      - name: Archive iOS app
        script: |
          cd ios

          XCODEPROJ=$(cat project.txt)

          echo "Using project: $XCODEPROJ"
          echo "Scheme: $SCHEME"

          xcodebuild clean

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -allowProvisioningUpdates \
            clean archive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive"

      - name: Create ExportOptions.plist
        script: |
          mkdir -p $CM_BUILD_DIR/build

          cat > $CM_BUILD_DIR/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>automatic</string>

              <key>teamID</key>
              <string>9WY9B7WP2D</string>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/build/ipa"

    artifacts:
      - build/ipa/**/*.ipa
      - build/*.xcarchive