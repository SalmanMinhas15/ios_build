workflows:
  ios-build:
    name: Godot iOS Signed Build
    max_build_duration: 90

    environment:
      xcode: latest

    scripts:
      - name: Show files
        script: ls -R ios

      - name: Build iOS project (SIGNED)
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "No xcodeproj found"
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          echo "Project: $XCODEPROJ"
          echo "Scheme: $SCHEME"

          # CLEAN
          xcodebuild clean

          # ARCHIVE (SIGNED BUILD)
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportPath $CM_BUILD_DIR/build/ipa \
            -exportOptionsPlist ../ExportOptions.plist

    artifacts:
      - build/ipa/*.ipa