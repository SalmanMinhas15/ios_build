workflows:
  ios-build:
    name: Godot iOS Build (No ASC)
    max_build_duration: 120

    environment:
      xcode: 16.3
      vars:
        BUNDLE_ID: "com.kickupkings.kickupkings"
        TEAM_ID: "9WY9B7WP2D"

    scripts:

      - name: Locate Xcode project
        script: |
          cd ios
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          echo "XCODEPROJ=$XCODEPROJ" >> $CM_ENV
          echo "SCHEME=$SCHEME" >> $CM_ENV

      - name: Clean & Archive
        script: |
          cd ios

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            clean archive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive"

      - name: Create ExportOptions.plist
        script: |
          cat > $CM_BUILD_DIR/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>signingStyle</key>
              <string>automatic</string>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/ipa"

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/App.xcarchive