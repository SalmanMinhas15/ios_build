workflows:
  ios-build:
    name: Godot iOS Signed Production Build
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - app_store_credentials 
      vars:
        XCODE_BUNDLE_IDENTIFIER: "com.kickupkings.kickupkings"

    scripts:
      - name: Show files
        script: ls -R ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles --archive-method app-store

      - name: Build and Sign Production iOS Archive
        script: |
          cd ios

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then echo "No xcodeproj found"; exit 1; fi
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          # 1. Archive the project
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            archive

          # 2. Generate ExportOptions.plist specifying the explicit Distribution Certificate identity
          cat <<'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9WY9B7WP2D</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iOS Distribution</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.kickupkings.kickupkings</key>
                  <string>PROVISIONING_PROFILE_PLACEHOLDER</string>
              </dict>
          </dict>
          </plist>
          EOF

          # Inject the dynamic provisioning profile UUID downloaded by Codemagic
          sed -i '' "s/PROVISIONING_PROFILE_PLACEHOLDER/$CM_PROVISIONING_PROFILE_UUID/" ExportOptions.plist

          # 3. Final Export
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/GodotGame.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - output/*.ipa